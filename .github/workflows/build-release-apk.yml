name: Build release APK

# Runs only when you start it by hand (Actions tab > Build release APK > Run workflow),
# or when you push a version tag such as v2.1.2.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1 (matches gradle-wrapper.properties)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Needs 3 repository secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64  your my-upload-key.jks, base64 encoded
      #   STORE_PASSWORD   the keystore password
      #   KEY_PASSWORD     the password of the key with alias "upload"
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing" && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unitask-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
