name: Build release APK

# Runs only when you start it by hand (Actions tab > Build release APK > Run workflow).
on:
  workflow_dispatch:
  permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-provider: basic
          
      # Run the unit tests first. If a test fails, the build stops here and no APK is made.
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      # Only if something failed: keep the test report so you can read what went wrong.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Needs 3 repository secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64  your my-upload-key.jks, base64 encoded
      #   STORE_PASSWORD   the keystore password
      #   KEY_PASSWORD     the password of the key with alias "upload"
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing" && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: unitask-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
