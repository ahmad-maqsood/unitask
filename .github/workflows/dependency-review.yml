name: Dependency security review

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.lockfile'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Check dependency vulnerabilities
    runs-on: ubuntu-24.04

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # Fail only if a PR introduces a high- or critical-severity vulnerability.
          fail-on-severity: high
