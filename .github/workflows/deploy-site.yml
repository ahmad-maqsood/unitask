name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['unitask-site/**']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy to Firebase Hosting
        working-directory: unitask-site
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          npx --yes firebase-tools@14 deploy --only hosting --project gen-lang-client-0196140574
          rm -f "$RUNNER_TEMP/key.json"
