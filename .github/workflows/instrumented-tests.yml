name: Run instrumented UI tests

# The unit-test workflow (test.yml) runs on the build machine. This one starts an Android emulator
# and runs the tests in app/src/androidTest on it, for example the Compose screen tests.
# It is a separate workflow on purpose: an emulator is slower and can fail for reasons that have
# nothing to do with the code, so it should not make the unit-test check red.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/instrumented-tests.yml'
      - '.github/actions/**'
      - '.env.example'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with basic caching
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Write Supabase settings (.env) from secrets
        uses: ./.github/actions/write-env
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}

      # The debug build is signed with this key (see signingConfigs in app/build.gradle.kts).
      - name: Prepare Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug app and test APKs before emulator startup
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Free memory before starting the emulator
        run: |
          # Gradle and Kotlin compile daemons stay alive after the build and keep
          # gigabytes of RAM, which starves the emulator and can kill it mid-run.
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          sleep 3
          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          free -m
          nproc

      - name: Enable KVM for hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # ReadmeScreenshotTest is left out: it needs the demo Supabase account and only runs from the
      # "Refresh README screenshots" workflow. The script is one line because android-emulator-runner
      # runs each line of this input as a separate command.
      - name: Run instrumented tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: adb start-server
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 3072 -cores 2
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.ReadmeScreenshotTest --no-daemon --stacktrace

      - name: Upload emulator crash data
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: emulator-crash-data
          path: /tmp/android-runner/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7
