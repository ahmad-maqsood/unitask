name: Mobile security scan (mobsfscan)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/mobsfscan.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/mobsfscan.yml'

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: mobsfscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Android source code
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Pin the scanner version so results are reproducible between runs.
      - name: Install mobsfscan
        run: python -m pip install --disable-pip-version-check mobsfscan==1.0.1

      # Keep findings informational initially. We can review the baseline
      # before deciding whether any rules should block future pull requests.
      - name: Run mobsfscan (SARIF)
        run: mobsfscan . --sarif --output mobsfscan.sarif --no-fail

      - name: Run mobsfscan (JSON report)
        if: always()
        run: mobsfscan . --json --output mobsfscan.json --no-fail

      - name: Run mobsfscan (HTML report)
        if: always()
        run: mobsfscan . --html --output mobsfscan.html --no-fail

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('mobsfscan.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan

      # Keep downloadable reports together in one ZIP artifact.
      - name: Upload mobsfscan reports
        if: always() && (hashFiles('mobsfscan.sarif') != '' || hashFiles('mobsfscan.json') != '' || hashFiles('mobsfscan.html') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobsfscan-reports
          path: |
            mobsfscan.sarif
            mobsfscan.json
            mobsfscan.html
          if-no-files-found: ignore
          retention-days: 30
