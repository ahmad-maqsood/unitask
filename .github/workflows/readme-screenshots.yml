name: Refresh README screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

jobs:
  capture:
    name: Capture app screens and open a PR
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install screenshot image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with basic caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare fictional Supabase group and messages
        id: seed_demo
        env:
          SCREENSHOT_DEMO_OWNER_EMAIL: ${{ secrets.SCREENSHOT_DEMO_OWNER_EMAIL }}
          SCREENSHOT_DEMO_OWNER_PASSWORD: ${{ secrets.SCREENSHOT_DEMO_OWNER_PASSWORD }}
          SCREENSHOT_DEMO_MEMBER_EMAIL: ${{ secrets.SCREENSHOT_DEMO_MEMBER_EMAIL }}
          SCREENSHOT_DEMO_MEMBER_PASSWORD: ${{ secrets.SCREENSHOT_DEMO_MEMBER_PASSWORD }}
        run: python3 .github/scripts/seed_screenshot_demo.py

      - name: Prepare Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug app and screenshot tests before emulator startup
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Enable KVM for hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Capture screens on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SCREENSHOT_DEMO_OWNER_EMAIL: ${{ secrets.SCREENSHOT_DEMO_OWNER_EMAIL }}
          SCREENSHOT_DEMO_OWNER_PASSWORD: ${{ secrets.SCREENSHOT_DEMO_OWNER_PASSWORD }}
          SCREENSHOT_GROUP_ID: ${{ steps.seed_demo.outputs.group_id }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          disable-spellchecker: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: adb start-server
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096 -cores 2
          script: bash .github/scripts/capture_readme_screenshots.sh

      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unitask-android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Update README gallery
        run: python3 .github/scripts/build_screenshots_gallery.py

      - name: Upload captured screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unitask-readme-screenshots
          path: docs/screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Create pull request with refreshed screenshots
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-readme-screenshots
          delete-branch: true
          add-paths: |
            README.md
            docs/screenshots/
          commit-message: "docs: refresh automated README screenshots"
          title: "docs: refresh automated README screenshots"
          body: |
            ## Summary
            - Capture current UniTask screens from a debug build on an Android emulator.
            - Refresh the README gallery and individual screenshot files.
            - Use fictional local demo data and a dedicated Supabase screenshot group.

            This pull request was generated by the manually triggered **Refresh README screenshots** workflow. It does not publish an APK.
