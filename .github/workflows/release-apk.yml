name: Build release APK
# Run manually from Actions > Build release APK.
# Leave both options unticked for a test APK build.
# Use "Test AI release notes" to test Gemini without creating a release or building an APK.
# Tick "Prepare draft release" only when preparing a new version's draft release and CHANGELOG PR.
# Nothing is published and main is never modified by this workflow.
on:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: 'Prepare a draft GitHub release and CHANGELOG pull request (does not publish)'
        type: boolean
        default: false
      test_release_notes:
        description: 'Test AI-generated release notes only; no APK, release, tag, or PR is created'
        type: boolean
        default: false

# Keep workflow-wide permissions read-only. Grant write access only to the build job.
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate workflow options
        run: |
          if [ "${{ inputs.prepare_release }}" = "true" ] && [ "${{ inputs.test_release_notes }}" = "true" ]; then
            echo "::error::Choose either test AI release notes or prepare a draft release, not both."
            exit 1
          fi

      - name: Ensure release labels exist
        if: ${{ inputs.prepare_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create feature --color "0E8A16" --description "New functionality for release notes" --force
          gh label create improvement --color "1D76DB" --description "Improvements to existing functionality" --force
          gh label create bug --color "D73A4A" --description "Bug fixes for release notes" --force
          gh label create maintenance --color "FBCA04" --description "Maintenance and project updates" --force
          gh label create skip-release-notes --color "BFD4F2" --description "Exclude this pull request from release summaries" --force

      - name: Read app version
        id: version
        run: |
          NAME=$(grep -oP 'versionName\\s*=\\s*"\\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\\s*=\\s*\\K[0-9]+' app/build.gradle.kts | head -1)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::Could not read versionName or versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "### Building UniTask $NAME (versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.prepare_release }}" = "true" ]; then
            echo "This run prepares a DRAFT release and a CHANGELOG PR. It does not publish." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.test_release_notes }}" = "true" ]; then
            echo "AI release-notes test only. No APK, release, tag, or changelog PR will be created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Test APK build only. No release or changelog PR will be created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate release-notes script
        run: |
          python3 -m py_compile .github/scripts/release_notes.py
          python3 .github/scripts/release_notes.py self-test

      - name: Check release preparation and generate notes
        if: ${{ inputs.prepare_release || inputs.test_release_notes }}
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "${{ inputs.prepare_release }}" = "true" ]; then
            TAG="v$NAME"
            BRANCH="release/changelog-v$NAME"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::A GitHub Release named $TAG already exists. Increase versionName first."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Git tag $TAG already exists. Choose a new version."
              exit 1
            fi
            if grep -Eq "^## \\[$NAME\\]([[:space:]]|$)" CHANGELOG.md; then
              echo "::error::CHANGELOG.md already contains a section for $NAME."
              exit 1
            fi
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "::error::Branch $BRANCH already exists. Review the earlier changelog PR."
              exit 1
            fi
            EXISTING_PR=$(gh pr list --state all --head "$BRANCH" --json number --jq 'length')
            if [ "$EXISTING_PR" != "0" ]; then
              echo "::error::A changelog PR for $TAG already exists."
              exit 1
            fi
          fi
          BASE_TAG=$(python3 .github/scripts/release_notes.py select-base --repo "$GITHUB_REPOSITORY" --version "$NAME")
          if [ "${{ inputs.test_release_notes }}" = "true" ]; then
            echo "### AI release-notes test" >> "$GITHUB_STEP_SUMMARY"
            echo "Comparing current workflow branch ($GITHUB_SHA) against latest published release $BASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Comparing v$NAME against $BASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/release_notes.py generate \\
            --repo "$GITHUB_REPOSITORY" --base-tag "$BASE_TAG" \\
            --head-ref "$GITHUB_SHA" --version "$NAME" \\
            --release-output "$RUNNER_TEMP/release-description.md" \\
            --changelog-output "$RUNNER_TEMP/changelog-entry.md"
          echo "release_file=$RUNNER_TEMP/release-description.md" >> "$GITHUB_OUTPUT"
          echo "changelog_file=$RUNNER_TEMP/changelog-entry.md" >> "$GITHUB_OUTPUT"

      - name: Save generated release notes
        if: ${{ always() && (inputs.prepare_release || inputs.test_release_notes) }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ steps.version.outputs.name }}
          path: |
            ${{ runner.temp }}/release-description.md
            ${{ runner.temp }}/changelog-entry.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Set up Java 21
        if: ${{ !inputs.test_release_notes }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        if: ${{ !inputs.test_release_notes }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Write Supabase settings (.env) from secrets
        if: ${{ !inputs.test_release_notes }}
        uses: ./.github/actions/write-env
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          required: 'true'

      - name: Run unit tests
        if: ${{ !inputs.test_release_notes }}
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Uses the existing repository secrets: KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD.
      - name: Restore upload keystore
        if: ${{ !inputs.test_release_notes }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"

      - name: Build release APK
        if: ${{ !inputs.test_release_notes }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Generate signed SLSA build provenance for the exact APK produced above.
      - name: Attest release APK
        if: ${{ !inputs.test_release_notes }}
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: app/build/outputs/apk/release/*.apk

      # Scorecard looks for .intoto.jsonl release assets. The action's signed
      # Sigstore bundle is JSON; compacting it produces a valid one-line JSONL bundle.
      - name: Export Scorecard-compatible provenance bundle
        if: ${{ !inputs.test_release_notes }}
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$BUNDLE_PATH" ] || [ ! -s "$BUNDLE_PATH" ]; then
            echo "::error::The attestation action did not produce a bundle."
            exit 1
          fi
          jq -c . "$BUNDLE_PATH" > "$RUNNER_TEMP/UniTask-$NAME.apk.intoto.jsonl"
          jq -e '.mediaType and .verificationMaterial and .dsseEnvelope' "$RUNNER_TEMP/UniTask-$NAME.apk.intoto.jsonl" >/dev/null
          echo "Generated provenance bundle for UniTask-$NAME.apk." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and provenance
        if: ${{ !inputs.test_release_notes }}
        uses: actions/upload-artifact@v7
        with:
          name: unitask-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/UniTask-${{ steps.version.outputs.name }}.apk.intoto.jsonl
          retention-days: 14

      - name: Create draft GitHub release
        if: ${{ inputs.prepare_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          BASE_TAG: ${{ steps.notes.outputs.base_tag }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          PROVENANCE="$RUNNER_TEMP/UniTask-$NAME.apk.intoto.jsonl"
          cp "$APK" "$RUNNER_TEMP/UniTask-$NAME.apk"
          FLAGS="--draft"
          case "$NAME" in *-*) FLAGS="$FLAGS --prerelease" ;; esac
          gh release create "v$NAME" "$RUNNER_TEMP/UniTask-$NAME.apk" "$PROVENANCE" \\
            --target "$GITHUB_SHA" --title "UniTask $NAME" \\
            --notes-file "$RUNNER_TEMP/release-description.md" $FLAGS
          echo "Created draft release v$NAME (compared with $BASE_TAG), including APK provenance." >> "$GITHUB_STEP_SUMMARY"

      - name: Create CHANGELOG pull request
        if: ${{ inputs.prepare_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          TAG="v$NAME"
          BRANCH="release/changelog-v$NAME"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          RELEASE_DATE=$(TZ=Asia/Karachi date +%d-%m-%Y)
          git fetch origin main
          git checkout -b "$BRANCH" origin/main
          python3 .github/scripts/release_notes.py insert-changelog \\
            --changelog CHANGELOG.md --version "$NAME" --date "$RELEASE_DATE" \\
            --download-url "$RELEASE_URL" --notes-file "$RUNNER_TEMP/changelog-entry.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add release notes for $TAG"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \\
            --title "docs: add CHANGELOG entry for $TAG" \\
            --body "Automatically generated release notes for $TAG. Review all entries, especially **Other Changes**, before merging. The matching GitHub Release is a draft and has not been published.

          Merge this PR after reviewing the changelog; publish the draft release separately when ready.

          Generated by workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "CHANGELOG pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft release: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
