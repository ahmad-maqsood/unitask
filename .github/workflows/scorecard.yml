name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Run weekly so the public score and README badge stay current.
    - cron: '23 4 * * 1'

# Keep workflow-wide permissions read-only.
permissions: read-all

jobs:
  analysis:
    name: Analyze repository security practices
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        id: scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('scorecard-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard-results.sarif
          category: openssf-scorecard

      - name: Upload Scorecard SARIF artifact
        if: always() && hashFiles('scorecard-results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssf-scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 30

  reports:
    name: Generate downloadable Scorecard reports
    needs: analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download SARIF report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openssf-scorecard-sarif
          path: reports

      # Generate native Scorecard JSON using the same action version as the
      # publishing scan. Publishing is disabled here to avoid a second publish.
      - name: Generate Scorecard JSON report
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: reports/scorecard-results.json
          results_format: json
          publish_results: false

      - name: Generate readable HTML report
        run: |
          python3 - <<'PY'
          import html
          import json
          from pathlib import Path

          json_path = Path("reports/scorecard-results.json")
          data = json.loads(json_path.read_text(encoding="utf-8"))
          formatted = json.dumps(data, indent=2, ensure_ascii=False)
          safe_json = html.escape(formatted)

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>OpenSSF Scorecard Report - UniTask</title>
            <style>
              :root {{ color-scheme: light dark; }}
              body {{ max-width: 1100px; margin: 40px auto; padding: 0 20px;
                     font: 16px/1.6 system-ui, sans-serif; }}
              h1 {{ line-height: 1.2; }}
              p {{ opacity: .8; }}
              pre {{ overflow: auto; padding: 20px; border-radius: 10px;
                     background: #8882; font: 13px/1.55 ui-monospace, monospace;
                     white-space: pre-wrap; overflow-wrap: anywhere; }}
              a {{ color: inherit; }}
            </style>
          </head>
          <body>
            <h1>OpenSSF Scorecard Report</h1>
            <p>Repository: <a href="https://github.com/ahmad-maqsood/unitask">ahmad-maqsood/unitask</a></p>
            <p>This report contains the complete Scorecard JSON results in a readable,
            formatted view. Use the JSON file for automated analysis and the SARIF file
            for GitHub Code Scanning.</p>
            <pre>{safe_json}</pre>
          </body>
          </html>
          """
          Path("reports/scorecard-results.html").write_text(page, encoding="utf-8")
          PY

      - name: Upload all Scorecard reports
        if: always() && hashFiles('reports/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssf-scorecard-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
