name: Smoke test on emulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Run smoke tests on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with basic caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug app and test APK before emulator startup
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Enable KVM for hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run smoke tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          disable-spellchecker: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: adb start-server
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096 -cores 2
          script: bash .github/scripts/run_smoke_tests.sh

      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unitask-smoke-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
