name: Run unit tests and lint

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'supabase/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.env.example'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'supabase/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.env.example'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and Android lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release-notes script
        run: |
          python3 -m py_compile .github/scripts/release_notes.py
          python3 .github/scripts/release_notes.py self-test

      - name: Validate lint report script
        run: |
          python3 -m py_compile .github/scripts/lint_report.py
          python3 .github/scripts/lint_report.py self-test

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Write Supabase settings (.env) from secrets
        uses: ./.github/actions/write-env
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run unit tests with diagnostic logging
        shell: bash
        env:
          # runner.temp is available at step level and inherited by Gradle test workers.
          JAVA_TOOL_OPTIONS: >-
            -XX:ErrorFile=${{ runner.temp }}/hs_err_pid%p.log
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee "${{ runner.temp }}/unit-tests.log"
          test_exit_code=${PIPESTATUS[0]}
          echo "Unit test Gradle exit code: ${test_exit_code}" | tee -a "${{ runner.temp }}/unit-tests.log"
          exit "${test_exit_code}"

      # Run lint even if the unit-test process crashes. The test step's failure
      # still keeps the overall job red, but this gives us both results at once.
      - name: Run Android lint
        if: always()
        run: ./gradlew lintDebug --stacktrace

      # Reads the lint XML report and prints every problem with its file, line, column,
      # rule and explanation. Also adds annotations on the exact lines and a summary page.
      - name: Show lint problems (file, line and reason)
        if: always()
        run: python3 .github/scripts/lint_report.py app/build/reports/lint-results-debug.xml

      # The release build shrinks the code with R8, which can break things (for example a missing
      # ProGuard rule) that the debug build never shows. This builds the release APK with a
      # throwaway key made here, so no real secrets are used and nothing is published.
      - name: Build release APK (checks R8 shrinking)
        if: always()
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-throwaway.jks
          STORE_PASSWORD: ci-throwaway
          KEY_PASSWORD: ci-throwaway
        run: |
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" -alias upload -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=UniTask CI"
          ./gradlew assembleRelease

      - name: Regenerate Room schema files
        if: always()
        run: |
          ./gradlew kspDebugKotlin --rerun
          echo "Schema files found:"
          ls -R app/schemas || echo "no app/schemas folder was created"

      # Room writes its database schema files into app/schemas every time the app is built.
      # They must be committed, because the migration test reads them. If this build made new or
      # changed schema files, this step fails and the next step attaches them so you can commit them.
      - name: Check Room schema files are committed
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::app/schemas is missing or out of date. Download the room-schemas artifact from this run and commit its contents into app/schemas."
            git status --porcelain -- app/schemas
            exit 1
          fi

      - name: Upload new Room schemas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
          retention-days: 7

      # Keep diagnostic output even when tests or lint fail, so a worker crash
      # does not leave us with only an incomplete HTML report.
      - name: Upload test and lint diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-and-lint-diagnostics
          path: |
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/hs_err_pid*.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: warn
          retention-days: 7
