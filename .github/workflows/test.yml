name: Run unit tests and lint

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'supabase/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'supabase/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and Android lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Regenerate Room schema files
        if: always()
        run: |
          ./gradlew kspDebugKotlin --rerun --no-daemon
          echo "Schema files found:"
          ls -R app/schemas || echo "no app/schemas folder was created"
          
      # Room writes its database schema files into app/schemas every time the app is built.
      # They must be committed, because the migration test reads them. If this build made new or
      # changed schema files, this step fails and the next step attaches them so you can commit them.
      - name: Check Room schema files are committed
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::app/schemas is missing or out of date. Download the room-schemas artifact from this run and commit its contents into app/schemas."
            git status --porcelain -- app/schemas
            exit 1
          fi

      - name: Upload new Room schemas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
